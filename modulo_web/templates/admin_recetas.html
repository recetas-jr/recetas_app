<!-- ======================================================
     TEMPLATE — ADMIN RECETAS MASTER (CAPTURA)
====================================================== -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin — Receta MASTER · Captura</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <style>
        input, select, button {
            height: 30px;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border: 2px solid #7b2cff !important;
            box-shadow: 0 0 0 1px #b58cff;
        }
    </style>
</head>

<body style="font-family: Arial, sans-serif; background:#f2f4f8; margin:0; padding:8px;">

<div style="
    background:#c00000;
    color:white;
    padding:12px 18px;
    font-weight:bold;
    border-radius:6px;
    margin-bottom:18px;
">
    *** ADMIN — RECETA MASTER · CAPTURA ***
</div>

{% if error %}
<div id="error-box" style="
    background:#ffdede;
    border:1px solid #cc0000;
    color:#900;
    padding:8px 12px;
    border-radius:6px;
    margin-bottom:10px;
    font-weight:bold;
">
    {{ error }}
</div>
{% endif %}

<form method="post" autocomplete="off" style="background:white; padding:10px; border-radius:6px; max-width:900px;">
    <input type="hidden" id="limpiar_form" value="{{ '1' if limpiar_form else '0' }}">

    <div style="margin-bottom:10px;">
        <label style="display:inline-block; width:140px; font-weight:bold;">Plato:</label>
        <select name="plato_id" id="plato_id" style="width:60%;">
            <option value="">-- Seleccione --</option>
            {% for p in platos %}
                <option value="{{ p.id }}"
                    {% if request.form.get('plato_id','')|int == p.id %}selected{% endif %}>
                    {{ p.nombre }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div style="margin-bottom:10px;">
        <label style="display:inline-block; width:140px; font-weight:bold;">Raciones base:</label>
        <input type="number" name="raciones_base" id="raciones_base"
               step="1" min="0" style="width:45px;" autocomplete="off"
               value="{{ request.form.get('raciones_base', '') }}">
    </div>

    <div style="margin-bottom:10px;">
        <label style="font-weight:bold;">Preparación:</label>
        <textarea name="preparacion" id="preparacion" rows="3" style="width:100%;">{{ request.form.get('preparacion','') }}</textarea>
    </div>

    <div style="margin-bottom:10px;">
        <label style="font-weight:bold;">Elaboración:</label>
        <textarea name="elaboracion" id="elaboracion" rows="4" style="width:100%;">{{ request.form.get('elaboracion','') }}</textarea>
    </div>

    <div style="margin-bottom:10px;">
        <label style="font-weight:bold;">Presentación:</label>
        <textarea name="presentacion" id="presentacion" rows="2" style="width:100%;">{{ request.form.get('presentacion','') }}</textarea>
    </div>

    <div style="margin-bottom:15px;">
        <label style="font-weight:bold;">Nutrición:</label>
        <textarea name="nutricion" id="nutricion" rows="2" style="width:100%;">{{ request.form.get('nutricion','') }}</textarea>
    </div>

<hr>

<div style="margin-top:15px; padding:10px; border:1px solid #ccc; border-radius:6px;">
    <div style="display:flex; gap:12px; align-items:flex-end;">

        <div style="flex:1 1 auto; min-width:320px;">
            <label style="font-weight:bold;">Ingrediente:</label><br>
            <select id="ingrediente_id" style="width:100%;">
                <option value="">-- Seleccione ingrediente --</option>
                {% for ing in ingredientes %}
                    <option value="{{ ing.id }}" data-um-nombre="{{ ing.unidad_nombre }}">
                        {{ ing.nombre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div style="flex:0 0 auto; width:60px;">
            <label style="font-weight:bold;">Cantidad:</label><br>
            <input type="number" id="cantidad" step="0.01" style="width:45px;" autocomplete="off">
        </div>

        <div style="flex:0 0 120px; padding-bottom:6px;">
            <span id="um_nombre" style="font-weight:bold; color:#004aad;"></span>
        </div>

        <div style="flex:0 0 auto; margin-left:10px;">
            <button type="button" id="btnGuardarReceta">
                Finalizar y Guardar en MASTER
            </button>
        </div>

    </div>
</div>

<br>

<table border="1" cellpadding="5" cellspacing="0" width="100%">
    <thead>
        <tr>
            <th>Ingrediente</th>
            <th width="120" style="text-align:right;">Cantidad</th>
            <th width="120">UM</th>
        </tr>
    </thead>
    <tbody id="tablaIngredientes"></tbody>
</table>

<input type="hidden" name="ingredientes_json" id="ingredientes_json">
</form>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.querySelector("form");
    if (!form) return;

    const selPlato = document.getElementById("plato_id");
    const inpRaciones = document.getElementById("raciones_base");
    const txtPreparacion = document.getElementById("preparacion");
    const txtElaboracion = document.getElementById("elaboracion");
    const txtPresentacion = document.getElementById("presentacion");
    const txtNutricion = document.getElementById("nutricion");

    const selIngrediente = document.getElementById("ingrediente_id");
    const inpCantidad = document.getElementById("cantidad");
    const spanUmNombre = document.getElementById("um_nombre");

    const tabla = document.getElementById("tablaIngredientes");
    const hiddenJson = document.getElementById("ingredientes_json");
    const btnGuardar = document.getElementById("btnGuardarReceta");

    const flagLimpiar = document.getElementById("limpiar_form");

    form.addEventListener("submit", function (e) {
        e.preventDefault();
    });

    let listaIngredientes = [];
    let hayCambiosNoGuardados = false;
    let platoAnterior = selPlato.value;

    function marcarCambio() {
        hayCambiosNoGuardados = true;
    }

    function limpiarLineaIngrediente() {
        inpCantidad.value = "";
        selIngrediente.value = "";
        spanUmNombre.textContent = "";
    }

    function limpiarFormulario() {
        form.reset();
        tabla.innerHTML = "";
        listaIngredientes = [];
        hiddenJson.value = "";
        hayCambiosNoGuardados = false;
        spanUmNombre.textContent = "";
    }

    // Restaurar raciones si venimos de guardado correcto
    if (flagLimpiar.value !== "1") {
        const guardado = localStorage.getItem("ultima_racion");
        if (guardado !== null) {
            inpRaciones.value = guardado;
        }
    }

    // Si es duplicado: limpiar todo menos raciones
    if (flagLimpiar && flagLimpiar.value === "1") {
        const racionesPrevias = inpRaciones.value;
        limpiarFormulario();
        inpRaciones.value = racionesPrevias;
        selPlato.value = "";
        selPlato.focus();
    }

    [
        inpRaciones,
        txtPreparacion,
        txtElaboracion,
        txtPresentacion,
        txtNutricion,
        inpCantidad
    ].forEach(el => {
        el.addEventListener("input", marcarCambio);
    });

    const ordenFoco = [
        selPlato,
        inpRaciones,
        txtPreparacion,
        txtElaboracion,
        txtPresentacion,
        txtNutricion,
        selIngrediente,
        inpCantidad
    ];

    function enfocarSiguiente(actual) {
        const idx = ordenFoco.indexOf(actual);
        if (idx === -1) return;
        const siguiente = ordenFoco[idx + 1];
        if (siguiente) siguiente.focus();
    }

    document.addEventListener("keydown", function (e) {
        const activo = document.activeElement;

        if (e.key === "Escape") {
            e.preventDefault();
            e.stopPropagation();
            limpiarFormulario();
            selPlato.focus();
            return;
        }

        if (e.key === "Enter" && activo === selPlato) {
            e.preventDefault();
            if (selPlato.value) {
                inpRaciones.focus();
            }
            return;
        }

        if (e.key === "Enter" && activo === inpRaciones) {
            e.preventDefault();
            const r = parseInt(inpRaciones.value, 10);
            if (isNaN(r) || r <= 0) {
                alert("Debe indicar raciones base mayores que 0.");
                inpRaciones.value = "";
                inpRaciones.focus();
                return;
            }
            enfocarSiguiente(activo);
            return;
        }

        if (e.key === "Enter") {

            if (activo === selIngrediente) {
                e.preventDefault();
                if (selIngrediente.value) {
                    inpCantidad.focus();
                }
                return;
            }

            if (activo === inpCantidad) {
                e.preventDefault();

                const ingId = selIngrediente.value;
                const cantidad = parseFloat(inpCantidad.value);
                if (!ingId || isNaN(cantidad) || cantidad <= 0) return;

                const ingIdInt = parseInt(ingId);

                const yaExiste = listaIngredientes.some(it => it.ingrediente_id === ingIdInt);
                if (yaExiste) {
                    const optDup = selIngrediente.options[selIngrediente.selectedIndex];
                    const nombreDup = optDup ? optDup.textContent : "";
                    alert("Ingrediente duplicado: " + nombreDup);
                    limpiarLineaIngrediente();
                    selIngrediente.focus();
                    return;
                }

                const opt = selIngrediente.options[selIngrediente.selectedIndex];
                const nombre = opt.textContent;
                const umNombre = opt.getAttribute("data-um-nombre") || "";

                const item = {
                    ingrediente_id: ingIdInt,
                    nombre: nombre,
                    cantidad: cantidad,
                    um: umNombre
                };

                listaIngredientes.push(item);
                hayCambiosNoGuardados = true;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${item.nombre}</td>
                    <td align="right">${item.cantidad}</td>
                    <td>${item.um}</td>
                `;
                tabla.appendChild(tr);

                hiddenJson.value = JSON.stringify(listaIngredientes);

                limpiarLineaIngrediente();
                selIngrediente.focus();
                return;
            }

            if (ordenFoco.includes(activo)) {
                e.preventDefault();
                enfocarSiguiente(activo);
                return;
            }
        }
    });

    selPlato.addEventListener("focus", () => platoAnterior = selPlato.value);

    selPlato.addEventListener("change", function () {

        if (hayCambiosNoGuardados || listaIngredientes.length > 0) {
            const ok = confirm(
                "Hay datos de una receta que no han sido guardados.\n" +
                "Si continúa, se perderán.\n\n¿Desea continuar?"
            );

            if (!ok) {
                selPlato.value = platoAnterior;
                return;
            }

            limpiarFormulario();
            selPlato.focus();
            platoAnterior = selPlato.value;
            return;
        }

        platoAnterior = selPlato.value;
        inpRaciones.focus();
    });

    selIngrediente.addEventListener("change", function () {
        marcarCambio();
        const opt = selIngrediente.options[selIngrediente.selectedIndex];
        const umNombre = opt ? (opt.getAttribute("data-um-nombre") || "") : "";
        spanUmNombre.textContent = umNombre;
        inpCantidad.focus();
    });

    btnGuardar.addEventListener("click", function () {
        // Guardar raciones para restaurar tras redirect correcto
        localStorage.setItem("ultima_racion", inpRaciones.value || "");
        hayCambiosNoGuardados = false;
        form.submit();
    });

});
</script>

</body>
</html>
