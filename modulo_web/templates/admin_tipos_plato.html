<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nomenclador de Tipos de Plato</title>
</head>
<body>

<h1>Nomenclador de Tipos de Plato</h1>

<table>
    <tr>
        <td valign="top" style="padding-right:40px;">

            <h3>Agregar</h3>

            {% if errores %}
              <div style="color:#b00020; font-weight:bold; margin-bottom:10px;">
                {% for e in errores %}
                  <div>❌ {{ e }}</div>
                {% endfor %}
              </div>
            {% endif %}

            <form method="post" id="formTipo" autocomplete="off">

                Nombre del tipo:<br>
                <input type="text" id="nombre" name="nombre" size="30" maxlength="50" autocomplete="off" required autofocus>

                <div style="font-size:12px; color:#555;">Enter guarda</div>

            </form>

        </td>

        <td valign="top">

            <h3>Tipos de plato registrados</h3>

            <div style="max-height:300px; overflow-y:auto; border:1px solid #999;">

                <table border="1" cellpadding="5" style="width:100%; border-collapse:collapse;">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Acciones</th>
                    </tr>

                    {% for t in tipos %}
                    <tr>
                        <td>{{ t.id }}</td>
                        <td>{{ t.nombre }}</td>
                        <td>
                            <form method="post"
                                  action="/admin/tipos_plato/borrar/{{ t.id }}"
                                  onsubmit="return confirm('¿Borrar tipo de plato?');"
                                  style="display:inline;">
                                <button type="submit" style="border:none; background:none; cursor:pointer;">
                                    🗑
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </table>

            </div>

        </td>
    </tr>
</table>

<script>
    // ENTER en Nombre -> guardar
    document.getElementById("nombre").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            document.getElementById("formTipo").submit();
        }
    });

    // ESC -> limpiar formulario
    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
            document.getElementById("nombre").value = "";
            document.getElementById("nombre").focus();
        }
    });
</script>

</body>
</html>
