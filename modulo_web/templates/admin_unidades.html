<!DOCTYPE html>
<html>

<head>
    <title>Nomenclador de Unidades de Medida</title>
</head>
<!--  -->

<body>

    <h1>Nomenclador de Unidades de Medida</h1>

    <table>
        <tr>
            <td valign="top" style="padding-right:40px;">

                <h3>Agregar</h3>

                {% if errores %}
                  <div style="color:#b00020; font-weight:bold; margin-bottom:10px;">
                    {% for e in errores %}
                      <div>❌ {{ e }}</div>
                {% endfor %}
                  </div>
                {% endif %}

                <form method="post" id="formUM" autocomplete="off">

                    Código:<br>
                    <input type="text" id="codigo" name="codigo" size="2" maxlength="2"
                        oninput="this.value = this.value.toUpperCase()" autocomplete="off" required autofocus>

                    <div style="font-size:12px; color:#555;">ESC para salir</div>

                    <br>

                    Nombre:<br>
                    <input type="text" id="nombre" name="nombre" size="20" maxlength="25" autocomplete="off" required>

                    <div style="font-size:12px; color:#555;">Enter guarda</div>

                </form>

            </td>

            <td valign="top">

                <h3>Unidades registradas</h3>

                <div style="max-height:300px; overflow-y:auto; border:1px solid #999;">

                    <table border="1" cellpadding="5" style="width:100%; border-collapse:collapse;">
                        <tr>
                            <th>ID</th>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Acciones</th>
                        </tr>

                        {% for u in unidades %}
                        <tr>
                            <td>{{ u.id }}</td>
                            <td>{{ u.codigo }}</td>
                            <td>{{ u.nombre }}</td>
                            <td>
                                <form method="post"
                                      action="/admin/unidades/borrar/{{ u.id }}"
                                      onsubmit="return confirm('¿Borrar unidad de medida?');"
                                      style="display:inline;">
                                    <button type="submit" style="border:none; background:none; cursor:pointer;">
                                        🗑
                                    </button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </table>

                </div>

            </td>
        </tr>
    </table>

    <script>
        // ENTER en Código -> pasar a Nombre (si hay valor)
        document.getElementById("codigo").addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                e.preventDefault();
                if (this.value.trim() !== "") {
                    document.getElementById("nombre").focus();
                }
            }
        });

        // Clic en Nombre sin Código -> volver a Código
        document.getElementById("nombre").addEventListener("focus", function () {
            if (document.getElementById("codigo").value.trim() === "") {
                alert("Debe teclear primero el código de la unidad de medida.");
                document.getElementById("codigo").focus();
            }
        });

        // ENTER en Nombre -> guardar
        document.getElementById("nombre").addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                e.preventDefault();
                document.getElementById("formUM").submit();
            }
        });

        // ESC en cualquier campo -> cancelar captura
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                document.getElementById("codigo").value = "";
                document.getElementById("nombre").value = "";
                document.activeElement.blur(); // perder foco
            }
        });
    </script>

</body>

</html>
