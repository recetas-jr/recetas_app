<script>
(function () {
    const clave = "recetasAppHoraApertura";
    let horaApertura = sessionStorage.getItem(clave);

    if (!horaApertura) {
        horaApertura = new Date().toLocaleTimeString("es-MX", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        });

        sessionStorage.setItem(clave, horaApertura);
    }

    const tituloBase = document.title.replace(
        /\s+\|\s+\d{2}:\d{2}:\d{2}$/,
        ""
    );

    document.title = tituloBase + " | " + horaApertura;
})();
</script>
