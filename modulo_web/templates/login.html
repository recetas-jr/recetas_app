<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Login Administración</title>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f2f4f8;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .login-box{
            background:white;
            padding:30px;
            border-radius:8px;
            width:320px;
            box-shadow:0 0 12px rgba(0,0,0,0.15);
        }

        h2{
            margin-top:0;
            text-align:center;
            color:#004aad;
        }

        input{
            width:100%;
            padding:10px;
            margin-bottom:12px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:10px;
            background:#004aad;
            color:white;
            border:none;
            border-radius:4px;
            cursor:pointer;
            font-weight:bold;
        }

        .error{
            background:#ffd6d6;
            color:#a10000;
            padding:10px;
            border-radius:4px;
            margin-bottom:12px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>🔐 Administración</h2>

        {% with mensajes = get_flashed_messages(category_filter=["error"]) %}
            {% if mensajes %}
                <div class="error">
                    {{ mensajes[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="post">

            <input type="text"
                   name="usuario"
                   placeholder="Usuario"
                   required
                   autofocus>

            <div style="position:relative;">

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Contraseña"
                       required
                       style="width:100%; padding-right:40px;">

                <span onclick="togglePassword()"
                      style="
                        position:absolute;
                        right:12px;
                        top:10px;
                        cursor:pointer;
                        user-select:none;
                      ">
                    👁️
                </span>

            </div>

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

    <script>

    function togglePassword(){

        const input = document.getElementById("password");

        if(input.type === "password"){
            input.type = "text";
        } else {
            input.type = "password";
        }

    }

    </script>




</body>

</html>
